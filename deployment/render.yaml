databases:
  - name: brightloop-db
    plan: free
    databaseName: brightloop
    user: brightloop

services:
  - type: web
    name: brightloop
    runtime: docker
    plan: free
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Brightloop
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: brightloop-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: brightloop-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: brightloop-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: brightloop-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: brightloop-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: RUN_MIGRATIONS
        value: true
